name: ml-research-copilot

services:
  postgres:
    image: postgres:17.11-bookworm
    profiles: [core]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-copilot}
      POSTGRES_USER: ${POSTGRES_USER:-copilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-copilot-dev-password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.19.1
    profiles: [core]
    ports:
      - "${QDRANT_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant-data:/qdrant/storage

  postgres-test:
    image: postgres:17.11-bookworm
    profiles: [test]
    environment:
      POSTGRES_DB: ${TEST_POSTGRES_DB:-test_copilot}
      POSTGRES_USER: ${TEST_POSTGRES_USER:-copilot_test}
      POSTGRES_PASSWORD: ${TEST_POSTGRES_PASSWORD:-copilot_test_password}
    ports:
      - "${TEST_POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres-test-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant-test:
    image: qdrant/qdrant:v1.19.1
    profiles: [test]
    ports:
      - "${TEST_QDRANT_PORT:-56333}:6333"
      - "${TEST_QDRANT_GRPC_PORT:-56334}:6334"
    volumes:
      - qdrant-test-data:/qdrant/storage

  backend:
    build:
      context: .
      dockerfile: infra/Dockerfile.backend
    profiles: [core]
    environment:
      COPILOT_ENV: ${COPILOT_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://copilot:copilot-dev-password@postgres:5432/copilot}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      QDRANT_COLLECTION_PREFIX: ${QDRANT_COLLECTION_PREFIX:-dev_}
      MODEL_MODE: ${MODEL_MODE:-real}
      SECRET_KEY: ${SECRET_KEY:-replace-this-secret}
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    command: ["uvicorn", "copilot.app:create_default_app", "--factory", "--host", "0.0.0.0", "--port", "8000"]

volumes:
  postgres-data:
  qdrant-data:
  postgres-test-data:
  qdrant-test-data:
