name: checks

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.12.10
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --project backend --frozen --group dev
      - run: uv run --project backend ruff check backend
      - run: uv run --project backend mypy backend/src
      - run: uv run --project backend pytest backend/tests -m "not integration" -q
