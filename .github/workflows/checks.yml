name: checks

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.12.10
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --project backend --frozen --group dev
      - run: uv run --project backend ruff check backend
      - run: uv run --project backend mypy --config-file backend/pyproject.toml backend/src
      - run: uv run --project backend pytest backend/tests -m "not integration" -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run api-types && git diff --exit-code lib/api-types.ts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
        env:
          CI: "1"
