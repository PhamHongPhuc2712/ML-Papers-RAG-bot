# Versioned venue-year source manifest (spec §4).
#
# Full venue-year: no sample limit, so every eligible accepted paper is taken.
# One manifest per venue because `venue` is a single value; one year each,
# because `sources.openreview.venue_id` is also single-valued and would
# otherwise be reused across years.
schema_version: 1
venue: NeurIPS
years: [2024]
track: main
sources:
  openreview:
    # Accepted NeurIPS 2024 main-conference notes carry this venueid. Rejected and
    # withdrawn submissions carry .../Rejected_Submission and
    # .../Withdrawn_Submission, and the Datasets & Benchmarks track is a separate
    # venueid, so this query is main-track accepted only. The adapter still maps
    # every note's venue label onto the decision enum rather than trusting it.
    # Counted 4035 notes on 2026-09-12: 61 oral, 326 spotlight, 3648 poster.
    api_base: https://api2.openreview.net
    api_version: v2
    venue_id: NeurIPS.cc/2024/Conference
    page_size: 1000
    auth:
      username_env: OPENREVIEW_USERNAME
      password_env: OPENREVIEW_PASSWORD
    pdf_base: https://api2.openreview.net/attachment?name=pdf&id=
    forum_base: https://openreview.net/forum?id=
  arxiv:
    enabled: false
    api_base: http://export.arxiv.org/api/query
    membership: false
  semantic_scholar:
    enabled: false
    api_base: https://api.semanticscholar.org/graph/v1
download:
  allowed_hosts:
    - api2.openreview.net
    - openreview.net
  max_bytes: 52428800
  timeout_seconds: 60
  # Seconds between provider requests per worker. OpenReview's measured limit
  # is 140 requests per 3600 s (ratelimit-policy: 140;w=3600), i.e. one per
  # 25.7 s. 30 s leaves headroom for listing calls on the same budget.
  min_interval_seconds: 30.0
