# The search-skip fix scored once on MTRAG Govt (agent follow-ups, plan
# docs/results.md), registered by the commit that
# adds this file, before any Govt answer is generated. Data: IBM mt-rag-benchmark @ cc5b1d48,
# Govt (214 turns, 28 conversations, every one test; never read before), release mtrag-govt-v1.
# All systems share the first stage (configs/search.yaml), evidence, generator (configs/chat.yaml)
# and judge (openai-gpt-6-luna-low, haiku.rag's answer-equivalence rubric).
#
#   LLM_DAILY_SPEND_CAP_USD=100 uv run --env-file .env --project backend python -m copilot.cli \
#     eval mtrag --config configs/experiments/mtrag-govt-agent.yaml --split test --frozen \
#     --database-url ...copilot_mtrag_govt --out reports/mtrag --max-spend-usd <preflight>
#
# Registered rule (primary): agent-v3 is a candidate for the chat if, in `live` mode over all
# judged Govt turns, it is more accurate than `pipeline` with exact McNemar p < 0.05 AND the
# bootstrap over conversations puts the difference's 95% interval above zero, AND the ORB guard in
# configs/experiments/orb-text-qa-agent-v3.yaml holds. Secondary, also registered: "the fix
# helped" if agent-v3 beats agent-v2 live under the same two conditions. Reported, deciding
# nothing: gold_prefix, skip rate and accuracy when skipped / searched, per answerability label,
# refusal precision and recall, cost, seconds. Adoption stays the developer's decision. The daily
# cap is lifted for this command only, as on 2026-10-25.
#
# agent-v3's prompt is research-v3 as committed in a1bdda6 unless Task 1's ClapNQ development read
# changes it; any change is committed before the Govt run and named here.
schema_version: 1
name: mtrag-govt-agent
corpus: {release: mtrag-govt-v1}
chat: configs/chat.yaml
judge: openai-gpt-6-luna-low
prompts: {judge: prompts/judge/answer-equivalence-haiku-v1.yaml}
modes: [live, gold_prefix]
systems:
  - name: pipeline
  - name: agent-v2
    agent: {prompt: prompts/agent/research-v2.yaml, max_searches: 3, max_model_calls: 8, max_sections: 4, answer_from: seen, verbatim_first: true}
  - name: agent-v3
    agent: {prompt: prompts/agent/research-v3.yaml, max_searches: 3, max_model_calls: 8, max_sections: 4, answer_from: seen, verbatim_first: true}
bootstrap: {resamples: 1000, seed: 42, confidence: 0.95}
decision: {mode: live, treated: agent-v3, baseline: pipeline, mcnemar_p: 0.05, secondary: {treated: agent-v3, baseline: agent-v2}}
budget: {max_spend_usd: 6.00}
