# Versioned corpus parsing and chunking policy (spec §4).
#
# Bumping parser_version or chunker_version changes every chunk identifier,
# which is intentional: chunk IDs are UUIDv5 over work ID, document checksum,
# both revisions and the section/chunk ordinals. Token counts below are in the
# tokenizer named under `chunker.tokenizer` and are enforced in those tokens:
# measured 2026-09-16, a 450-word window was ~780 BGE-M3 tokens and 51.4% of
# the pilot's chunks exceeded this 600 cap, so the window is now cut on the
# model's own tokens. The offline suite uses the small committed fixture
# tokenizer in data/fixtures/tokenizer/ rather than downloading this one.
schema_version: 1
parser:
  # pypdf plain-text extraction, labeled low quality. Docling can replace it by
  # implementing PageAdapter and bumping parser_version after the 20-paper audit.
  adapter: pypdf-text
  parser_version: pypdf-text-v2
  max_pdf_bytes: 52428800
  reject_encrypted: true
chunker:
  policy: fixed-window
  chunker_version: fixed-window-v2
  target_tokens: 450
  hard_cap_tokens: 600
  overlap_tokens: 60
  references_in_default_evidence: false
  uuid_namespace: 9d2f5a6c-7b3e-4c1a-8e5d-2f6b9c1d3e47
  # Pinned by revision and checksum, cached under ${DATA_DIR}/models/tokenizers/
  # and never fetched at run time. Startup fails if it is absent or altered;
  # it must never fall back to counting words.
  tokenizer:
    kind: model
    repo: BAAI/bge-m3
    revision: 5617a9f61b028005a4858fdac845db406aefb181
    file: tokenizer.json
    sha256: 21106b6d7dab2952c1d496fb21d5dc9db75c28ed361a05f5020bbba27810dd08
