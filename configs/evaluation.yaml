# Evaluation configuration. Every value here is part of a run's identity: a
# benchmark result is only comparable to another if these matched.

lexical:
  # Spec §7. Baked into the stored document weights, so changing either forces
  # a new corpus release and a re-encode of every sparse vector.
  k1: 1.2
  b: 0.75
  # Unicode NFKC, lowercase, alphanumeric runs. Acronyms survive as single
  # terms; punctuation does not become one.
  tokenizer: nfkc-lower-alnum-v1
  # Papers and chunks keep separate corpus statistics (spec §7). Both are
  # recorded on the run manifest.
  document_text: "title + '\\n' + abstract"

metrics:
  # Reported at these cutoffs for G2.
  recall_at: [10, 50]
  ndcg_at: [10]
  mrr_at: [10]
  # An unlabelled result is unjudged, not irrelevant. Every reported score
  # carries the coverage it was computed at (spec §11).
  require_judged_coverage: true
  max_grade: 3

benchmarks:
  orb:
    # Open RAG Bench (Vectara): 1,000 arXiv papers, 3,045 LLM-generated questions with a
    # reference answer, one gold document and one gold section each. Pinned 2026-10-06.
    repo: vectara/open_ragbench
    revision: 63f6b052ff83508b08e242db42263ee708815c26
    # The dataset card declares CC-BY-NC-4.0 (license tag read 2026-10-06). Local-use-only:
    # questions, answers, section text and PDFs live under DATA_DIR, never in the
    # repository, a report or an export; the repository carries ids, labels and the sample.
    license: cc-by-nc-4.0
    redistribution: local_use_only
    documents: 1000
    queries: 3045
    # The text slice this project can answer: queries whose source is text alone.
    text_slice:
      queries: 1914
      extractive: 1021
      abstractive: 893
      gold_documents: 387
    # Fetched 2026-10-07 into ${DATA_DIR}/benchmarks/orb, 716 MB: the four label files and
    # the 1,000 corpus files (one digest over their sorted per-file sha256).
    checksums:
      pdf/arxiv/queries.json: 13822fc7efd6889eaf20a6809adfff1cf040699ec2254131a897850b922cac6f
      pdf/arxiv/qrels.json: c2ad02c5461402e643cb363e7ae562b7bba4a3f5a4e7a5149707365c82848580
      pdf/arxiv/answers.json: 2ab51b9e773ed10259043ad869789aa1621af601591da73d34db3551a2d662bd
      pdf/arxiv/pdf_urls.json: e67b8246918ef1e92250b9c0b58cd830a58d68f9bc288dda01db53cdbc8d4298
      corpus:
        files: 1000
        sha256: b03dd8f2f7df758dbcb7b3cbe5ce3031bf986ecca1ded7971de84393d62f4a9d
    # The answering sample (ORB plan): stratified by type, at most two queries per gold
    # document across both sets, sorted before shuffled; 400 frozen, scored once per
    # configuration, and 100 development. Retrieval reads all 1,914.
    sample:
      seed: 42
      frozen: 400
      development: 100
      per_document: 2

run:
  seed: 42
