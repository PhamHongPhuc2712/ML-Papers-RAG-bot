# Ranking parameters for the search service (spec §7). Model revisions are pinned
# in configs/models.yaml; this file holds only how candidates are gathered,
# fused, reranked and bounded in time. Every value is part of a run's identity.
schema_version: 1

candidates:
  # Per branch, BM25 and dense, with identical filters.
  per_branch: 100

fusion:
  # RRF constant: sum(1/(k + rank)) over one-based ranks, computed in our code.
  rrf_k: 60

rerank:
  # At most this many fused candidates are reranked, and hybrid_rerank returns
  # only from them: reranker logits are never compared with RRF scores.
  depth: 50

cache:
  # Spec §7: an ordering's top 200 (hybrid_rerank: its reranked head) is kept this
  # long for signed cursors to page through, keyed by query, filters, release and
  # ranker revisions. A cursor older than this is refused as expired.
  depth: 200
  ttl_seconds: 600

deadlines_seconds:
  # Candidate branches run concurrently, each within its own budget.
  branch: 1.0
  rerank: 1.5
  # The whole request, after which the service falls back or fails, typed.
  total: 3.0
  # Opt-in deep search (hybrid_rerank_llm) only. The stages above keep the 3 s total;
  # the hosted LLM then gets its own budget, inside a deep-search total (p95 <= 20 s).
  llm_rerank: 20.0
  llm_total: 25.0

# A model error — not a timeout — is retried at most this often, and only while
# the total deadline still has room for it.
rerank_retries: 1
