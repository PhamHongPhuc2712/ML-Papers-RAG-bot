# Ordered venue-year plan for the corpus run (spec §4 coverage).
#
# 42 venue-years, 85,732 eligible accepted main-conference papers for 2023-2026,
# counted by classify_track over the pinned registry. Findings, workshops,
# industry and demo tracks, shared tasks, tutorials, co-located conferences and
# unaccepted submissions are excluded by the same classifier and are not listed
# here.
#
# Order is ascending by eligible paper count, so the cheap venue-years complete
# and bank their text before the large ones start; a run that dies overnight
# loses the least. ICLR 2024 is already mirrored on this machine, so its
# download stage is a no-op.
#
# The driver mirrors one venue-year, ingests it, runs the workers, verifies that
# no job is still pending, then deletes that venue-year's PDFs — keeping any
# whose paper did not parse, because that copy is the only thing a retry can
# read. Peak disk is therefore the largest single venue-year (ICLR 2026, about
# 48 GB), not the ~450 GB the whole corpus would need at once.
defaults:
  # Parse workers. 12 cores here; 9 leaves room for PostgreSQL and the
  # concurrent download of the next venue-year.
  workers: 9
  # Measured on the JMLR shard, 2026-09-16: 8 workers gave 6.2 MB/s, 16 gave
  # 7.7 MB/s and 32 fell back to 6.3 MB/s. Per-file latency dominates on small
  # PDFs and past ~16 the concurrency costs more than it buys.
  download_workers: 16
  # Refuse to start a venue-year with less than this free, so a run cannot fill
  # the disk out from under the database mid-parse.
  min_free_gb: 80
venue_years:
  - {venue: JMLR, year: 2025}   # 308 eligible
  - {venue: JMLR, year: 2023}   # 401 eligible
  - {venue: JMLR, year: 2024}   # 421 eligible
